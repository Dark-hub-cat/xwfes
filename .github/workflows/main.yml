name: build

on: [push, workflow_dispatch]

jobs:
  core-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S ft-igpu-src -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release -j
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Collect binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin-out | Out-Null
          Copy-Item build/Release/*.exe bin-out/
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ft-windows-x64
          path: bin-out/*.exe

  core-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S ft-igpu-src -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build -j
      - run: ctest --test-dir build --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: ft-linux-x64
          path: |
            build/ft-cli
            build/ft-tests

  vulkan-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          curl.exe -L -o vk-sdk.exe "https://sdk.lunarg.com/sdk/download/1.4.309.0/windows/VulkanSDK-1.4.309.0-Installer.exe"
          Start-Process .\vk-sdk.exe -ArgumentList "--accept-licenses","--default-no","--confirm-command","install","--root","C:\VulkanSDK" -Wait
          echo "VULKAN_SDK=C:\VulkanSDK" >> $env:GITHUB_ENV
      - name: Compile shaders
        shell: pwsh
        run: |
          & "$env:VULKAN_SDK\Bin\glslangValidator.exe" -V ft-igpu-src/shaders/moe_ffn_chunk.comp -o ft-igpu-src/shaders/moe_ffn_chunk.spv
      - name: Configure (Vulkan)
        shell: pwsh
        run: cmake -S ft-igpu-src -B build-vk -DCMAKE_BUILD_TYPE=Release "-DFT_WITH_VULKAN=ON" "-DCMAKE_PREFIX_PATH=$env:VULKAN_SDK"
      - name: Build (Vulkan)
        run: cmake --build build-vk --config Release -j
      - name: Test (Vulkan build, CPU fallback in tests)
        run: ctest --test-dir build-vk -C Release --output-on-failure
      - name: Collect binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin-out | Out-Null
          Copy-Item build-vk/Release/*.exe bin-out/
          Copy-Item ft-igpu-src/shaders/moe_ffn_chunk.spv bin-out/
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ft-windows-x64-vulkan
          path: bin-out/*
